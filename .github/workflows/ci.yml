# Root workflow — runs the full Python test suite under tests/ (including
# tests/test_wizard_telemetry_http.py). Nested submodule copies may define
# their own workflows; this is the canonical CI for the forge-lenses repo.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Markdown + PyYAML (handbook build)
        run: pip install "markdown>=3.5" PyYAML
      - name: Documentation gate (public build + nav + links + diagrams + API coverage)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: bash scripts/check-docs.sh

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest PyYAML "markdown>=3.5" jsonschema referencing
      - name: Pytest (full tests/ tree)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python3 -m pytest tests/ -q

  playwright-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps (for python3 -m lenses under Electron)
        run: pip install PyYAML "markdown>=3.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Xvfb (Electron needs a display on Linux)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install desktop npm dependencies
        working-directory: desktop
        run: npm ci
      - name: Install Playwright browsers
        working-directory: desktop
        run: npx playwright install --with-deps
      - name: Playwright E2E (Electron smoke)
        working-directory: desktop
        env:
          CI: "true"
          LENSES_WORKSPACE_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}
        run: xvfb-run --auto-servernum -- npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: desktop/playwright-report/
          retention-days: 7

  studio-ux-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps (lenses server)
        run: pip install PyYAML "markdown>=3.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lenses-enterprise/package-lock.json
      - name: Install lenses-enterprise dependencies
        working-directory: lenses-enterprise
        run: npm ci
      - name: Install Playwright Chromium (crawl v4)
        working-directory: lenses-enterprise
        run: npx playwright install chromium
      - name: Build Studio (fixture server)
        working-directory: lenses-enterprise
        run: npm run build
      - name: Studio UX crawl v4 gate (multi-repo fixture)
        env:
          PYTHONPATH: ${{ github.workspace }}
          E2E_BUILD_STUDIO: "0"
          E2E_LENSES_PORT: "17556"
        run: bash scripts/studio-ux-crawl-gate.sh
