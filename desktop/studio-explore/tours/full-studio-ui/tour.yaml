# Full Lenses Studio UI — aligned with TopNavigation + SectionSidebar (navigationConfig.ts).
# Output directories: <workspace_lens>/<section>/…  plus flow/Shared for routes not on the sidebar.
# Run twice worth of top tabs: Flow lens and Artifacts lens (cookie workspace_lens).
version: 1
title: Full Studio UI — navigation layout

base_url: http://127.0.0.1:8080

defaults:
  max_shots_per_folder: 20
  viewport:
    width: 1440
    height: 900

folders:
  # --- Flow lens (top nav: Workspace, Plans, Delivery, Projects, Sites, Blog, Knowledge) ---
  - id: flow-workspace
    directory: flow/Workspace
    workspace_lens: flow
    nav_section: home
    title: "Flow · Workspace (sidebar)"
    max_shots: 12
    steps:
      - id: portfolio-overview
        title: Portfolio overview
        path: /studio/
        wait_ms: 2800
        wait_selector: body
        annotation: Top tab Workspace — portfolio overview.
      - id: today
        title: What needs attention today
        path: /studio/plan?tab=today
        wait_ms: 3500
        wait_selector: body
      - id: boards-from-workspace
        title: Execution boards
        path: /studio/board
        wait_ms: 2500
        wait_selector: body
      - id: all-projects
        title: All projects
        path: /studio/projects
        wait_ms: 2500
        wait_selector: body
      - id: overview-charts
        title: Workspace activity charts
        path: /studio/overview/charts
        wait_ms: 3500
        wait_selector: body
      - id: llm-settings
        title: LLM preferences
        path: /studio/settings/llm
        wait_ms: 2000
        wait_selector: body
      - id: search
        title: Search
        path: /studio/search
        wait_ms: 2000
        wait_selector: body
      - id: chat
        title: LLM chat (demo)
        path: /studio/chat
        wait_ms: 2500
        wait_selector: body

  - id: flow-plans
