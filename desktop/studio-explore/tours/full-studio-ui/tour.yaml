# Full Lenses Studio — aligned with lenses-enterprise primary nav:
# Home, Work, Projects, Knowledge, Publish (+ header utilities).
# Admin / inspect / automation (Sprint UX7): flow/Shared/Admin-and-inspect and artifacts/Shared/Admin-and-inspect
# (Advanced reporting, connector health, audit log, toolset, UX diagnostics, AI Setup).
# Output directories use folder `directory` (workspace_lens + path); nav_section matches TopSectionId where applicable.
version: 1
title: Full Studio UI — navigation layout + admin surfaces

base_url: http://127.0.0.1:8080

defaults:
  max_shots_per_folder: 20
  viewport:
    width: 1440
    height: 900

folders:
  # --- Flow lens · Home (top tab Home; sidebar without advanced reporting) ---
  - id: flow-home
    directory: flow/Home
    workspace_lens: flow
    nav_section: home
    title: "Flow · Home"
    max_shots: 12
    steps:
      - id: portfolio-overview
        title: Home overview
        path: /studio/
        wait_ms: 2800
        wait_selector: body
        annotation: Primary tab Home — portfolio overview.
      - id: today
        title: Today
        path: /studio/plan?tab=today
        wait_ms: 3500
        wait_selector: body
      - id: boards
        title: Boards
        path: /studio/board
        wait_ms: 2500
        wait_selector: body
      - id: all-projects
        title: All projects
        path: /studio/projects
        wait_ms: 2500
        wait_selector: body
      - id: search
        title: Search
        path: /studio/search
        wait_ms: 2000
        wait_selector: body
      - id: chat
        title: SDLC copilot (chat)
        path: /studio/chat
        wait_ms: 2500
        wait_selector: body

  # --- Flow lens · Work (Plan, boards, timeline, WBS, readiness; no /overview/charts in sidebar) ---
  - id: flow-work
    directory: flow/Work
    workspace_lens: flow
    nav_section: work
    title: "Flow · Work"
    max_shots: 16
    steps:
      - id: plan-default
        title: Plan summary
