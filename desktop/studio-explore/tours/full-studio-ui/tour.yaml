        wait_selector: body
      - id: story-cockpit
        title: Story
        path: /studio/plan?tab=story
        wait_ms: 3500
        wait_selector: body
      - id: source-context
        title: Sources
        path: /studio/plan?tab=source
        wait_ms: 3500
        wait_selector: body
      - id: wbs
        title: Work breakdown
        path: /studio/wbs
        wait_ms: 2800
        wait_selector: body
      - id: wbs-view
        title: Work breakdown (detail)
        path: /studio/wbs/view
        wait_ms: 2800
        wait_selector: body
      - id: timeline
        title: Timeline
        path: /studio/timeline
        wait_ms: 3500
        wait_selector: body
      - id: roadmap-section
        title: Roadmap section preview
        path: /studio/roadmap-section
        wait_ms: 3000
        wait_selector: body
      - id: roadmaps-summary-classic
        title: Roadmaps (classic HTML)
        path: /roadmaps/summary
        wait_ms: 3000
        wait_selector: body
        annotation: Full-workspace classic page; linked from Work sidebar.
      - id: methodology-readiness
        title: Release readiness
        path: /studio/knowledge/methodology/readiness
        wait_ms: 3500
        wait_selector: body
      - id: today-from-delivery
        title: Today (delivery deep link)
        path: /studio/plan?tab=today&from=delivery
        wait_ms: 3500
        wait_selector: body
        annotation: Same Today route with from=delivery query (strip context).

